# Run from the repo root: docker compose -f deploy/docker-compose.yml up -d --build
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  paper:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "arb", "paper", "--strategy", "funding_carry"]
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
    logging: *logging

  scanner:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "arb", "scan", "--interval", "60"]
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped
    logging: *logging
