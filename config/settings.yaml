# Global settings. Live trading stays OFF until a strategy passes backtest + walk-forward + paper trading.
live_trading: false

capital:
  total_usd: 1100          # ~₹1 lakh starting capital
  max_per_trade_usd: 300   # never commit more than this to one opportunity

risk:
  max_daily_loss_pct: 2.0
  max_total_loss_pct: 10.0
  max_gross_exposure_x: 2.0   # sum of |position notional| <= 2 x total capital
  max_quote_age_s: 15         # reject new entries on older prices

# India: crypto (VDA) gains taxed at 30% + 4% cess; losses cannot be set off against gains.
# Verify with a CA — this is applied to positive net PnL only, so reported numbers are after-tax.
tax:
  rate_on_gains: 0.312

# Default VIP-0 fee tiers as fractions (0.001 = 0.1%). Update to your actual tier / BNB discounts.
exchanges:
  binance:
    fees:
      spot: {maker: 0.0010, taker: 0.0010}
      swap: {maker: 0.0002, taker: 0.0005}
      future: {maker: 0.0002, taker: 0.0005}
  bybit:
    fees:
      spot: {maker: 0.0010, taker: 0.0010}
      swap: {maker: 0.0002, taker: 0.00055}
      future: {maker: 0.0002, taker: 0.00055}
  okx:
    fees:
      spot: {maker: 0.0008, taker: 0.0010}
      swap: {maker: 0.0002, taker: 0.0005}
      future: {maker: 0.0002, taker: 0.0005}

# Approx. withdrawal fees in units of the asset (cheapest common network). Used by cross-exchange rebalancing cost.
withdrawal_fees:
  USDT: 1.0
  BTC: 0.0001
  ETH: 0.0008
  SOL: 0.01
  XRP: 0.25

universe:
  quote: USDT
  # Symbols scanned on every exchange (spot). Perp/futures symbols are derived from these.
  base_assets: [BTC, ETH, SOL, XRP, BNB, DOGE, ADA, AVAX, LINK, TON, SUI, LTC]

scanners:
  cross_exchange:
    enabled: true
    min_net_bps: 5            # report only if net edge after all costs >= 5 bps
  triangular:
    enabled: true
    exchanges: [binance]
    min_net_bps: 1
  funding:
    enabled: true
    holding_days: 7           # horizon used to value funding income
    min_annualized_net_pct: 10
  basis:
    enabled: true
    min_annualized_net_pct: 8
  stat_arb:
    enabled: true
    exchange: binance
    timeframe: 1h
    lookback_bars: 720        # 30 days of hourly bars
    max_coint_pvalue: 0.05
    entry_z: 2.0

storage:
  dir: data

# ---------------- Phase 2: strategies, backtest, paper trading ----------------
strategies:
  funding_carry:
    exchange: binance
    bases: [BTC, ETH, SOL]
    notional_usd: 300           # per leg; spot + perp = 2 legs
    entry_annualized_pct: 15    # enter when trailing avg funding, net of round-trip costs, beats this
    exit_annualized_pct: 3      # exit when trailing avg funding falls below this
    avg_window: 21              # number of past funding settlements averaged (21 x 8h = 7 days)
    max_hold_days: 90           # longer holds = fewer round trips and fewer taxable trades
    execution: maker            # taker | maker (post-only maker leg + taker hedge, see `execution` below)
    maker_leg: perp             # perp: Binance spot maker fee equals taker, so the perp leg is the useful maker leg
    # Maker perp + 90-day hold was the best setup on 13 months of real Binance data (in-sample);
    # paper trade it before trusting it.
  stat_arb:
    exchange: binance
    pairs: [[ETH, BTC]]         # (y, x); pick pairs from Phase 1 stat_arb reports / walk-forward
    lookback_bars: 720
    entry_z: 2.0
    exit_z: 0.5
    stop_z: 4.0
    max_hold_bars: 240
    notional_usd: 300           # total across both legs

backtest:
  timeframe: 1h
  spread_bps: 2.0               # modelled full bid/ask spread around the bar close
  slippage_bps: 2.0             # extra adverse slippage per fill

# Maker (post-only) order handling for strategies with execution: maker.
execution:
  requote_bps: 2                # re-post at the new touch when price moves this far away
  through_bps: 1                # a resting order fills only when price trades this far through it
  entry_timeout_s: 21600        # cancel unfilled entries after 6h (no trade is fine)
  exit_timeout_s: 7200          # unfilled exits switch to taker after 2h so exits always complete

# Live trading safety. Live needs live_trading: true AND env ARB_LIVE_CONFIRM=I_UNDERSTAND_REAL_MONEY.
live:
  capital_usd: 0                # REQUIRED for live: USDT you funded (spot + futures); 2%/10% limits use it
  max_order_usd: 50             # hard cap per order; raise to 300 only after the $50 stage goes well
  min_liq_distance_pct: 25      # close a perp group if liquidation is closer than this
  reconcile_every_s: 300        # compare exchange balances/positions with the bot's state
  reconcile_tolerance_pct: 2
  order_timeout_s: 20
  gate:                         # `python -m arb validate` must PASS before going live
    min_paper_days: 14
    max_pnl_gap_pct: 30
    min_after_tax_pnl_usd: 0

paper:
  interval_s: 30
  state_dir: data/paper
  book_depth: 20

# ---------------- DeFi flash-loan arbitrage measurement (SIMULATION ONLY, see docs/FLASH_ARB_DESIGN.md) ----------------
# RPC URLs with keys go only in .env (ARBITRUM_RPC=..., BASE_RPC=...), never here.
defi:
  enabled: true
  addresses_file: defi/addresses.json
  storage_dir: data/defi
  loan_tokens: [WETH, USDC]
  min_pool_tvl_usd: 10000
  min_profit_usd: 0.05
  max_loan_usd: 50000
  max_hops: 3
  tri_top_k: 3
  premium_bps: 5
  # Fitted to the measured fork gas (contracts/gas-report.json), max over both chains, so a 2-hop v3+v2 route = 462,826
  # (measured 449,993 / 438,620). A failed attempt costs nearly as much as a success (426,230 / 411,047).
  gas: {base_units: 98882, v3_hop_units: 230290, v2_hop_units: 133654,
        # added by review T4 from docs/FLASH_ARB_SECURITY.md section 7 (pool gas per crossed initialized tick):
        tick_units: 25000, pancake_lm_units: 26000, pancake_lm_tick_units: 10000,
        limit_margin: 1.3}   # tx gas limit = estimate x 1.3; a replay needing more = out-of-gas miss at the limit
  sim_gas: 25000000                # lower to 16000000 when the sim backend is a Hardhat fork
  chains:
    arbitrum:
      rpc_url_env: ARBITRUM_RPC
      rpc_url_default: https://arb1.arbitrum.io/rpc
      max_rps: 5
      burst: 10
      tip_gwei: 0.0
      tokens: [WETH, USDC, USDT, DAI, WBTC, ARB]
      venues: [uniswap_v3, sushi_v3, pancake_v3, sushi_v2, camelot_v2]
      lateness_blocks: [0, 2, 8]      # ~0 s, ~0.5 s, ~2 s at 0.257 s/block
      sample_every_s: 10
    base:
      rpc_url_env: BASE_RPC
      rpc_url_default: https://mainnet.base.org
      max_rps: 3
      burst: 6
      tip_gwei: 0.01
      tokens: [WETH, USDC, USDT, DAI, cbBTC, cbETH]
      venues: [uniswap_v3, sushi_v3, pancake_v3, aerodrome_slipstream_initial, aerodrome_slipstream_gaugecaps, aerodrome_slipstream_gaugesv3, sushi_v2, aerodrome_v2]
      lateness_blocks: [0, 1, 2]      # ~0 s, ~2 s, ~4 s
      sample_every_s: 10
